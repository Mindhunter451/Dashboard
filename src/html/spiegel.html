<div class="mirror" id="mirror" hidden aria-label="Spiegel-Modus">
  <div class="m-in" id="m-in">
    <section class="m-clock">
      <p class="m-time" id="m-time">00:00</p>
      <p class="m-date" id="m-date">&nbsp;</p>
      <ul class="m-notes" id="m-notes"></ul>
    </section>
    <section class="m-wx" id="m-wx" hidden>
      <div class="m-wx-now"><span class="m-wx-ico" id="m-wx-ico"></span><b id="m-wx-temp"></b></div>
      <p id="m-wx-desc"></p>
      <p class="m-dim" id="m-wx-sub"></p>
    </section>
    <section class="m-cal" id="m-cal" hidden></section>
    <div class="m-side">
      <section class="m-dep" id="m-dep" hidden></section>
      <section class="m-cd" id="m-cd"></section>
    </div>
    <figure class="m-verse" id="m-verse" hidden>
      <blockquote id="m-verse-text"></blockquote>
      <figcaption id="m-verse-ref"></figcaption>
    </figure>
  </div>
  <button type="button" class="m-exit" id="m-exit">Spiegel verlassen</button>
</div>
