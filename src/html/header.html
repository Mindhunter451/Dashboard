  <header class="sky" id="sky">
    <div class="sky-stars" aria-hidden="true"></div>
    <div class="sky-in">
      <div class="sky-top">
        <h1 class="greet" id="h-greet">Moin Jere</h1>
        <nav class="tabs" id="tabs" role="tablist" aria-label="Seiten"></nav>
        <div class="sky-tools">
          <button type="button" class="sky-btn" id="mirror-btn" title="Spiegel-Modus (Taste S)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="13" rx="2"/><path d="M9 21h6M12 17v4M7 8.5l3-3M7 12.5l7-7"/></svg><span>Spiegel</span></button>
          <button type="button" class="sky-btn edit-btn" id="edit-btn" aria-pressed="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20h4L19 9a2.8 2.8 0 0 0-4-4L4 16v4z"/><path d="M13.5 6.5l4 4"/></svg><span id="edit-btn-txt">Bearbeiten</span></button>

        </div>
      </div>
      <div class="sky-main">
        <p class="time" id="h-time" aria-live="off">00:00</p>
        <div class="sky-side">
          <p class="sky-day" id="h-day">&nbsp;</p>
          <p class="sky-date"><span id="h-date">&nbsp;</span><span class="kw" title="Kalenderwoche">KW <b id="h-kw">00</b></span></p>
          <p class="sky-line" id="h-wx" hidden></p>
          <p class="sky-line" id="h-sun"></p>
          <p class="sky-line sky-next" id="h-next" hidden></p>
        </div>
      </div>
    </div>
    <div class="arc" id="arc" aria-hidden="true">
      <svg class="arc-svg" viewBox="0 0 1440 100" preserveAspectRatio="none"><path class="arc-rest" id="arc-rest" d=""/><path class="arc-done" id="arc-done" d=""/></svg>
      <span class="arc-sun" id="arc-sun"></span>
      <span class="arc-lbl" id="arc-rise"></span>
      <span class="arc-lbl" id="arc-set"></span>
    </div>
  </header>
