<!-- Vorlagen für Widgets, die es mehrfach geben kann. Jede Kopie bekommt ihre eigenen Daten,
     deshalb hier keine IDs, sondern data-r zum Wiederfinden innerhalb der Karte. -->

<template id="tpl-tasks">
  <section class="card" data-type="tasks">
    <div class="card-head">
      <h2><span data-r="title">Aufgaben</span></h2>
      <span class="src" data-r="src"></span>
      <button type="button" class="icon-btn" data-r="conf" aria-label="Todoist-Verbindung" title="Todoist-Verbindung"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12M20 18h0"/><circle cx="16" cy="6" r="2"/><circle cx="10" cy="12" r="2"/><circle cx="18" cy="18" r="2"/></svg></button>
    </div>
    <div class="tk-state" data-r="state" hidden>
      <p data-r="state-text"></p>
      <div class="form-row"><button type="button" class="btn" data-r="action" hidden></button></div>
    </div>
    <form class="panel" data-r="form" hidden novalidate>
      <h3>Todoist verbinden</h3>
      <p class="hint">Damit deine Todoist-Projekte hier auftauchen, braucht das Cockpit deinen persönlichen API Token. Den findest du in Todoist unter Einstellungen, Integrationen, Entwickler.</p>
      <label class="field"><span class="lbl">API Token</span><input data-r="token" type="password" maxlength="100" autocomplete="off" spellcheck="false" placeholder="Token aus Todoist einfügen"></label>
      <p class="hint">Der Token bleibt nur in diesem Browser gespeichert und steckt nie in der Datei selbst. Er öffnet dein ganzes Todoist, also gib ihn sonst nirgends ein.</p>
      <p class="err" data-r="err" hidden></p>
      <div class="form-row">
        <button type="submit" class="btn" data-r="save">Verbinden</button>
        <a class="btn-ghost" href="https://app.todoist.com/app/settings/integrations/developer" target="_blank" rel="noopener">Token holen ↗</a>
        <button type="button" class="btn-ghost" data-r="cancel" hidden>Abbrechen</button>
        <button type="button" class="btn-danger" data-r="forget" hidden>Trennen</button>
      </div>
    </form>
    <form class="tk-add" data-r="addform" hidden novalidate>
      <input data-r="new" type="text" maxlength="400" autocomplete="off" enterkeyhint="done" placeholder="Neue Aufgabe, z. B. Ticket prüfen morgen p2" aria-label="Neue Aufgabe" title="Datum, Uhrzeit, p1 bis p4 und @Labels erkennt Todoist direkt, wie in der App.">
      <select data-r="proj" aria-label="Projekt"></select>
      <button type="submit" class="btn-ghost" data-r="addbtn">Anlegen</button>
    </form>
    <div class="tk-cols" data-r="cols"></div>
    <div class="tk-foot" data-r="foot">
      <a class="btn-ghost" href="https://app.todoist.com/app/today" target="_blank" rel="noopener">Todoist öffnen ↗</a>
    </div>
  </section>
</template>

<template id="tpl-progress">
  <section class="card" data-type="progress">
    <div class="card-head">
      <h2><span data-r="title">Fortschritt</span></h2>
      <button type="button" class="icon-btn" data-r="add" aria-label="Balken hinzufügen" title="Balken hinzufügen"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></button>
    </div>
    <form class="panel" data-r="form" hidden novalidate>
      <h3 data-r="form-title">Neuer Balken</h3>
      <div class="grid2">
        <label class="field"><span class="lbl">Kategorie</span>
          <select data-r="kind">
            <option value="day">Arbeitstag (Uhrzeit)</option>
            <option value="workweek">Arbeitswoche</option>
            <option value="month">Monat</option>
            <option value="year">Jahr</option>
            <option value="range">Zeitraum (Datum)</option>
          </select>
        </label>
        <label class="field"><span class="lbl">Name</span><input data-r="name" type="text" maxlength="40" autocomplete="off"></label>
      </div>
      <div class="grid2" data-r="time">
        <label class="field"><span class="lbl">Von</span><input data-r="start" type="time"></label>
        <label class="field"><span class="lbl">Bis</span><input data-r="end" type="time"></label>
      </div>
      <fieldset class="days" data-r="days">
        <legend class="lbl">An diesen Tagen</legend>
        <label><input type="checkbox" data-day="1"><span>Mo</span></label>
        <label><input type="checkbox" data-day="2"><span>Di</span></label>
        <label><input type="checkbox" data-day="3"><span>Mi</span></label>
        <label><input type="checkbox" data-day="4"><span>Do</span></label>
        <label><input type="checkbox" data-day="5"><span>Fr</span></label>
        <label><input type="checkbox" data-day="6"><span>Sa</span></label>
        <label><input type="checkbox" data-day="0"><span>So</span></label>
      </fieldset>
      <div class="grid2" data-r="date">
        <label class="field"><span class="lbl">Startdatum</span><input data-r="from" type="date"></label>
        <label class="field"><span class="lbl">Enddatum</span><input data-r="to" type="date"></label>
      </div>
      <p class="err" data-r="err" hidden></p>
      <div class="form-row">
        <button type="submit" class="btn">Speichern</button>
        <button type="button" class="btn-ghost" data-r="cancel">Abbrechen</button>
        <button type="button" class="btn-danger" data-r="del">Löschen</button>
      </div>
    </form>
    <ul class="bars" data-r="bars"></ul>
  </section>
</template>

<template id="tpl-links">
  <section class="card" data-type="links">
    <div class="card-head">
      <h2><span data-r="title">Schnellzugriff</span></h2>
      <button type="button" class="icon-btn" data-r="add" aria-label="Link hinzufügen" title="Link hinzufügen"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></button>
    </div>
    <form class="panel" data-r="form" hidden novalidate>
      <h3 data-r="form-title">Neuer Link</h3>
      <div class="grid2">
        <label class="field"><span class="lbl">Name</span><input data-r="name" type="text" maxlength="30" autocomplete="off" placeholder="z. B. Webmail"></label>
        <label class="field"><span class="lbl">Adresse</span><input data-r="url" type="url" maxlength="500" autocomplete="off" spellcheck="false" placeholder="https://…"></label>
      </div>
      <p class="err" data-r="err" hidden></p>
      <div class="form-row">
        <button type="submit" class="btn">Speichern</button>
        <button type="button" class="btn-ghost" data-r="cancel">Abbrechen</button>
        <button type="button" class="btn-danger" data-r="del" hidden>Löschen</button>
      </div>
    </form>
    <ul class="qlinks" data-r="list"></ul>
  </section>
</template>

<template id="tpl-notes">
  <section class="card" data-type="notes">
    <div class="card-head">
      <h2><span data-r="title">Notizen</span></h2>
      <span class="src" data-r="state"></span>
    </div>
    <textarea class="notes" data-r="text" maxlength="8000" placeholder="Schnell was notieren, wird automatisch gespeichert."></textarea>
  </section>
</template>

<template id="tpl-habits">
  <section class="card" data-type="habits">
    <div class="card-head">
      <h2><span data-r="title">Gewohnheiten</span></h2>
      <button type="button" class="icon-btn" data-r="add" aria-label="Gewohnheit hinzufügen" title="Gewohnheit hinzufügen"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></button>
    </div>
    <form class="panel" data-r="form" hidden novalidate>
      <h3 data-r="form-title">Neue Gewohnheit</h3>
      <label class="field"><span class="lbl">Name</span><input data-r="name" type="text" maxlength="40" autocomplete="off" placeholder="z. B. Sport, Lesen, Vokabeln"></label>
      <div class="grid2">
        <label class="field"><span class="lbl">Rhythmus</span>
          <select data-r="rhythm">
            <option value="daily">Jeden Tag</option>
            <option value="workdays">Werktags (Mo bis Fr)</option>
            <option value="weekly">Ein paar Mal pro Woche</option>
          </select>
        </label>
        <label class="field" data-r="n-wrap"><span class="lbl">Wie oft pro Woche</span><input data-r="n" type="number" min="1" max="7" inputmode="numeric"></label>
      </div>
      <p class="err" data-r="err" hidden></p>
      <div class="form-row">
        <button type="submit" class="btn">Speichern</button>
        <button type="button" class="btn-ghost" data-r="cancel">Abbrechen</button>
        <button type="button" class="btn-danger" data-r="del" hidden>Löschen</button>
      </div>
    </form>
    <ul class="habits" data-r="list"></ul>
    <p class="hint" data-r="legend">Kreis antippen, wenn du es heute geschafft hast. Mit den Kästchen trägst du die letzten Wochen nach.</p>
  </section>
</template>

<template id="tpl-learn">
  <section class="card" data-type="learn">
    <div class="card-head">
      <h2><span data-r="title">Lernfortschritt</span></h2>
      <button type="button" class="icon-btn" data-r="set" aria-label="Prüfung einstellen" title="Prüfung"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12M20 18h0"/><circle cx="16" cy="6" r="2"/><circle cx="10" cy="12" r="2"/><circle cx="18" cy="18" r="2"/></svg></button>
    </div>
    <form class="panel" data-r="form" hidden novalidate>
      <h3>Prüfung</h3>
      <div class="grid2">
        <label class="field"><span class="lbl">Datum</span><input data-r="date" type="date"></label>
        <label class="field"><span class="lbl">Uhrzeit (optional)</span><input data-r="time" type="time"></label>
      </div>
      <label class="field"><span class="lbl">Lernstart (optional, macht die Tempo-Prognose genauer)</span><input data-r="start" type="date"></label>
      <p class="err" data-r="err" hidden></p>
      <div class="form-row">
        <button type="submit" class="btn">Speichern</button>
        <button type="button" class="btn-ghost" data-r="cancel">Abbrechen</button>
      </div>
    </form>
    <div class="setup" data-r="empty" hidden>
      <h3>Wann ist die Prüfung?</h3>
      <p>Datum und Themen eintragen, dann siehst du, ob dein Tempo reicht.</p>
      <div class="form-row"><button type="button" class="btn" data-r="empty-btn">Datum eintragen</button></div>
    </div>
    <div class="vac-hero" data-r="hero">
      <div class="big"><b data-r="days">0</b><span data-r="days-lbl">Tage bis zur Prüfung</span></div>
      <dl class="legend" data-r="dl"></dl>
    </div>
    <div class="stack" data-r="bar-wrap" role="img"><div class="seg-taken" data-r="bar"></div></div>
    <p class="verdict" data-r="pace"></p>
    <form class="ln-add" data-r="addform" novalidate>
      <input data-r="new" type="text" maxlength="80" autocomplete="off" enterkeyhint="done" placeholder="Neues Thema, z. B. Subnetting" aria-label="Neues Thema">
      <button type="submit" class="btn-ghost">+ Thema</button>
    </form>
    <ul class="topics" data-r="topics"></ul>
    <div class="form-row" data-r="more-row"></div>
    <p class="hint" data-r="tip">Tipp: Du kannst eine ganze Liste einfügen, ein Thema pro Zeile.</p>
  </section>
</template>

<template id="tpl-football">
  <section class="card" data-type="football">
    <div class="card-head">
      <h2><span data-r="title">Bundesliga</span></h2>
      <span class="src" data-r="md"></span>
    </div>
    <div class="fb-fav" data-r="fav"></div>
    <div class="seg sm fb-tabs" role="group" aria-label="Ansicht" data-r="tabs">
      <button type="button" data-v="day">Spieltag</button><button type="button" data-v="table">Tabelle</button><button type="button" data-v="scorers">Torjäger</button>
    </div>
    <div class="fb-body" data-r="body"></div>
    <p class="src" data-r="src"></p>
  </section>
</template>

<!-- Abfahrten an einer Haltestelle (gibt es beliebig oft) -->
<template id="tpl-dep">
  <section class="card" data-type="dep">
    <div class="card-head">
      <h2><span data-r="title">Abfahrten</span></h2>
      <span class="card-st" data-r="rt"></span>
      <div class="actions">
        <button type="button" class="icon-btn" data-r="set" aria-label="Haltestelle und Filter einstellen" title="Haltestelle und Filter einstellen"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12M20 18h0"/><circle cx="16" cy="6" r="2"/><circle cx="10" cy="12" r="2"/><circle cx="18" cy="18" r="2"/></svg></button>
      </div>
    </div>
    <div class="setup" data-r="setup" hidden>
      <h3>Haltestelle wählen</h3>
      <p>Live-Abfahrten mit Verspätungen und wann du los musst.</p>
      <div class="form-row"><button type="button" class="btn" data-r="setup-btn">Suchen</button></div>
    </div>
    <div class="dp-live-box" data-r="live" hidden>
      <p class="dp-go" data-r="go" hidden></p>
      <p class="err" data-r="err" hidden></p>
      <ul class="dp-list" data-r="list"></ul>
      <div class="dp-alerts" data-r="alerts"></div>
    </div>
    <p class="src dp-src" data-r="src"></p>
  </section>
</template>
